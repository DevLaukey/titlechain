databases:
  - name: titlechain-postgres
    plan: free
    databaseName: titlechain
    user: titlechain

services:
  # ── Express API ──────────────────────────────────────────────────────────
  - type: web
    name: titlechain-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: titlechain-postgres
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: HARDHAT_NETWORK
        value: baseSepolia
      # Secrets — set these in the Render dashboard (Environment tab), not here.
      - key: BASE_SEPOLIA_RPC_URL
        sync: false
      - key: DEPLOYER_PRIVATE_KEY
        sync: false
      - key: PINATA_API_KEY
        sync: false
      - key: PINATA_SECRET_KEY
        sync: false
      - key: IPFS_GATEWAY
        value: https://ipfs.io/ipfs/
      # Update this if you rename the web service below.
      - key: CORS_ORIGINS
        value: https://titlechain-web.onrender.com

  # ── Next.js frontend ─────────────────────────────────────────────────────
  - type: web
    name: titlechain-web
    runtime: docker
    plan: free
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    envVars:
      # Render automatically passes envVars through as Docker --build-arg
      # values (matched by name to the ARGs declared in apps/web/Dockerfile),
      # so these get baked into the client bundle at build time. Must match
      # the API service's actual URL (Render assigns it as
      # https://<name>.onrender.com).
      - key: NEXT_PUBLIC_API_URL
        value: https://titlechain-api.onrender.com/api
      - key: NEXT_PUBLIC_HARDHAT_CHAIN_ID
        value: "31337"
      - key: NEXT_PUBLIC_BASE_SEPOLIA_CHAIN_ID
        value: "84532"
