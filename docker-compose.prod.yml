version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: titlechain_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-titlechain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-titlechain}
      POSTGRES_DB: ${POSTGRES_DB:-titlechain}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    # No exposed port — database is internal only
    networks:
      - titlechain-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-titlechain} -d ${POSTGRES_DB:-titlechain}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: titlechain_api_prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-titlechain}:${POSTGRES_PASSWORD:-titlechain}@postgres:5432/${POSTGRES_DB:-titlechain}
      NODE_ENV: production
    ports:
      - "3001:3001"
    networks:
      - titlechain-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3001/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: titlechain_web_prod
    restart: always
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://api:3001/api
    ports:
      - "3000:3000"
    networks:
      - titlechain-network

  nginx:
    image: nginx:alpine
    container_name: titlechain_nginx_prod
    restart: always
    depends_on:
      - api
      - web
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - titlechain-network

volumes:
  postgres_prod_data:

networks:
  titlechain-network:
    driver: bridge
